name: Update road data

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort queue, so a */15 cron is a
    # ceiling rather than a promise; the site reports the real age of the data.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # (touch) re-registered 2026-09-03 after the scheduler never fired.

permissions:
  contents: write

# Let a run finish before the next one starts. Overlapping runs race on the push
# and the loser rewrites data.json with an older snapshot.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests shapely pyproj

      - name: Rebuild data.json
        run: python scripts/build_data.py

      - name: Commit data.json if changed
        run: |
          git config user.name "road-construction-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing on origin/main (attempt $i)."
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
